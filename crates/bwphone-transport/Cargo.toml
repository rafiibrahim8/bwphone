[package]
name = "bwphone-transport"
description = "Noise channel, framing, messages and derived values shared by PC and phone"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["tokio"]
# The async drivers over a stream, used on the PC. The phone links the
# crate without this feature and drives the sans-I/O state machines from Kotlin.
tokio = ["dep:tokio"]

[dependencies]
base64 = "0.22"
bip39 = { version = "2", default-features = false, features = ["std"] }
chacha20poly1305 = "0.10"
data-encoding = "2"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = { version = "0.10", default-features = false, features = ["default-resolver", "default-resolver-crypto"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "time"], optional = true }
zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
