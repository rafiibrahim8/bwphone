[package]
name = "bwphone"
description = "The daemon: serves the browser extensions, holds the Noise key, talks to the phone"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bwphone-nm = { path = "../bwphone-nm" }
bwphone-transport = { path = "../bwphone-transport" }
bwphone-wrap = { path = "../bwphone-wrap" }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = "1"
png = "0.18.1"
toml = "1.1.6"

[dev-dependencies]
bwphone-fakephone = { path = "../bwphone-fakephone" }
sha1 = "0.10"
